<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo Abanico - Opción B</title>
    <style>
        :root {
            --stem-color: #2e7d32;
            --petal-color: #ffd700;
            --flower-center: #8B4513;
        }

        .bouquet-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e8, #f0f8f0);
            padding: 20px;
        }

        .bouquet-svg {
            width: 350px;
            height: 500px;
            max-width: 90vw;
            max-height: 80vh;
        }

        /* Animación de tallos rectos */
        .stem-line {
            transform-origin: bottom;
            transform: scaleY(0);
            animation: growStemLine 0.8s ease-out forwards;
        }

        .stem-line-1 { animation-delay: 0.1s; }
        .stem-line-2 { animation-delay: 0.2s; }
        .stem-line-3 { animation-delay: 0.3s; }
        .stem-line-4 { animation-delay: 0.4s; }
        .stem-line-5 { animation-delay: 0.5s; }

        @keyframes growStemLine {
            to { transform: scaleY(1); }
        }

        /* Flores minimalistas */
        .flower-minimal {
            opacity: 0;
            transform: scale(0);
            animation: popFlower 0.5s ease-out forwards;
        }

        .flower-minimal-1 { animation-delay: 1.0s; }
        .flower-minimal-2 { animation-delay: 1.1s; }
        .flower-minimal-3 { animation-delay: 1.2s; }
        .flower-minimal-4 { animation-delay: 1.3s; }
        .flower-minimal-5 { animation-delay: 1.4s; }

        @keyframes popFlower {
            0% { opacity: 0; transform: scale(0); }
            70% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 10px;
        }

        .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="bouquet-container">
        <svg class="bouquet-svg" id="bouquetSVG" viewBox="0 0 350 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="stemGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" style="stop-color:#1b5e20"/>
                    <stop offset="100%" style="stop-color:#4caf50"/>
                </linearGradient>
                
                <radialGradient id="simpleFlower" cx="50%" cy="50%">
                    <stop offset="0%" style="stop-color:#fff200"/>
                    <stop offset="70%" style="stop-color:#ffd700"/>
                    <stop offset="100%" style="stop-color:#ffb300"/>
                </radialGradient>
            </defs>
            
            <!-- Tallos rectos en abanico -->
            <line class="stem-line stem-line-1" x1="175" y1="450" x2="125" y2="250" stroke="url(#stemGradient)" stroke-width="6" stroke-linecap="round"/>
            <line class="stem-line stem-line-2" x1="175" y1="450" x2="150" y2="200" stroke="url(#stemGradient)" stroke-width="5" stroke-linecap="round"/>
            <line class="stem-line stem-line-3" x1="175" y1="450" x2="175" y2="180" stroke="url(#stemGradient)" stroke-width="6" stroke-linecap="round"/>
            <line class="stem-line stem-line-4" x1="175" y1="450" x2="200" y2="200" stroke="url(#stemGradient)" stroke-width="5" stroke-linecap="round"/>
            <line class="stem-line stem-line-5" x1="175" y1="450" x2="225" y2="250" stroke="url(#stemGradient)" stroke-width="6" stroke-linecap="round"/>
            
            <!-- Flores simples -->
            <circle class="flower-minimal flower-minimal-1" cx="125" cy="250" r="18" fill="url(#simpleFlower)" stroke="#ffa000" stroke-width="2"/>
            <circle class="flower-minimal flower-minimal-2" cx="150" cy="200" r="16" fill="url(#simpleFlower)" stroke="#ffa000" stroke-width="2"/>
            <circle class="flower-minimal flower-minimal-3" cx="175" cy="180" r="20" fill="url(#simpleFlower)" stroke="#ffa000" stroke-width="2"/>
            <circle class="flower-minimal flower-minimal-4" cx="200" cy="200" r="16" fill="url(#simpleFlower)" stroke="#ffa000" stroke-width="2"/>
            <circle class="flower-minimal flower-minimal-5" cx="225" cy="250" r="18" fill="url(#simpleFlower)" stroke="#ffa000" stroke-width="2"/>
            
            <!-- Centros de flores -->
            <circle cx="125" cy="250" r="6" fill="#8B4513" class="flower-minimal flower-minimal-1"/>
            <circle cx="150" cy="200" r="5" fill="#8B4513" class="flower-minimal flower-minimal-2"/>
            <circle cx="175" cy="180" r="7" fill="#8B4513" class="flower-minimal flower-minimal-3"/>
            <circle cx="200" cy="200" r="5" fill="#8B4513" class="flower-minimal flower-minimal-4"/>
            <circle cx="225" cy="250" r="6" fill="#8B4513" class="flower-minimal flower-minimal-5"/>
        </svg>
    </div>

    <div class="controls">
        <button class="btn" onclick="exportBouquetAsPNG(1920, 1080)">Descargar PNG</button>
    </div>

    <script>
        async function exportBouquetAsPNG(width, height) {
            const svg = document.getElementById('bouquetSVG');
            const svgClone = svg.cloneNode(true);
            svgClone.setAttribute('width', width);
            svgClone.setAttribute('height', height);
            
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgClone);
            const svgDataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
            
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, width, height);
            
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0, width, height);
                const link = document.createElement('a');
                link.download = `ramo-abanico-${width}x${height}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            img.src = svgDataUrl;
        }
    </script>
</body>
</html>
