<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo Árbol - Opción C</title>
    <style>
        :root {
            --stem-color: #2e7d32;
            --branch-color: #388e3c;
            --petal-color: #ffd700;
            --flower-center: #8B4513;
        }

        .bouquet-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f1f8e9, #e8f5e8);
            padding: 20px;
        }

        .bouquet-svg {
            width: 300px;
            height: 550px;
            max-width: 90vw;
            max-height: 80vh;
        }

        /* Tallo principal */
        .main-trunk {
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: growTrunk 1.2s ease-out forwards;
        }

        @keyframes growTrunk {
            to { stroke-dashoffset: 0; }
        }

        /* Ramas laterales */
        .branch {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: growBranch 0.8s ease-out forwards;
        }

        .branch-1 { animation-delay: 1.3s; }
        .branch-2 { animation-delay: 1.4s; }
        .branch-3 { animation-delay: 1.5s; }
        .branch-4 { animation-delay: 1.6s; }
        .branch-5 { animation-delay: 1.7s; }
        .branch-6 { animation-delay: 1.8s; }

        @keyframes growBranch {
            to { stroke-dashoffset: 0; }
        }

        /* Flores en ramas */
        .tree-flower {
            opacity: 0;
            transform: scale(0);
            animation: bloomTreeFlower 0.6s ease-out forwards;
        }

        .tree-flower-1 { animation-delay: 2.2s; }
        .tree-flower-2 { animation-delay: 2.3s; }
        .tree-flower-3 { animation-delay: 2.4s; }
        .tree-flower-4 { animation-delay: 2.5s; }
        .tree-flower-5 { animation-delay: 2.6s; }
        .tree-flower-6 { animation-delay: 2.7s; }
        .tree-flower-main { animation-delay: 2.8s; }

        @keyframes bloomTreeFlower {
            0% { opacity: 0; transform: scale(0); }
            60% { opacity: 0.8; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 10px;
        }

        .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="bouquet-container">
        <svg class="bouquet-svg" id="bouquetSVG" viewBox="0 0 300 550" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#1b5e20"/>
                    <stop offset="50%" style="stop-color:#2e7d32"/>
                    <stop offset="100%" style="stop-color:#4caf50"/>
                </linearGradient>
                
                <linearGradient id="branchGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#2e7d32"/>
                    <stop offset="100%" style="stop-color:#66bb6a"/>
                </linearGradient>
                
                <radialGradient id="treeFlowerGradient" cx="30%" cy="30%">
                    <stop offset="0%" style="stop-color:#fff200"/>
                    <stop offset="40%" style="stop-color:#ffed4e"/>
                    <stop offset="80%" style="stop-color:#ffd700"/>
                    <stop offset="100%" style="stop-color:#ffb300"/>
                </radialGradient>
            </defs>
            
            <!-- Tallo principal -->
            <path class="main-trunk" 
                  d="M 150 500 Q 148 400 152 300 Q 148 200 150 100 Q 152 60 150 50" 
                  stroke="url(#trunkGradient)" 
                  stroke-width="8" 
                  stroke-linecap="round" 
                  fill="none"/>
            
            <!-- Ramas laterales -->
            <path class="branch branch-1" d="M 150 380 Q 120 360 100 350" stroke="url(#branchGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path class="branch branch-2" d="M 150 380 Q 180 360 200 350" stroke="url(#branchGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path class="branch branch-3" d="M 150 280 Q 110 260 85 250" stroke="url(#branchGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path class="branch branch-4" d="M 150 280 Q 190 260 215 250" stroke="url(#branchGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path class="branch branch-5" d="M 150 180 Q 125 160 110 150" stroke="url(#branchGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path class="branch branch-6" d="M 150 180 Q 175 160 190 150" stroke="url(#branchGradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
            
            <!-- Flores en puntas de ramas -->
            <g class="tree-flower tree-flower-1" transform="translate(100, 350)">
                <circle r="12" fill="url(#treeFlowerGradient)"/>
                <circle r="4" fill="#8B4513"/>
            </g>
            
            <g class="tree-flower tree-flower-2" transform="translate(200, 350)">
                <circle r="12" fill="url(#treeFlowerGradient)"/>
                <circle r="4" fill="#8B4513"/>
            </g>
            
            <g class="tree-flower tree-flower-3" transform="translate(85, 250)">
                <circle r="14" fill="url(#treeFlowerGradient)"/>
                <circle r="5" fill="#8B4513"/>
            </g>
            
            <g class="tree-flower tree-flower-4" transform="translate(215, 250)">
                <circle r="14" fill="url(#treeFlowerGradient)"/>
                <circle r="5" fill="#8B4513"/>
            </g>
            
            <g class="tree-flower tree-flower-5" transform="translate(110, 150)">
                <circle r="13" fill="url(#treeFlowerGradient)"/>
                <circle r="4" fill="#8B4513"/>
            </g>
            
            <g class="tree-flower tree-flower-6" transform="translate(190, 150)">
                <circle r="13" fill="url(#treeFlowerGradient)"/>
                <circle r="4" fill="#8B4513"/>
            </g>
            
            <!-- Flor principal en la punta -->
            <g class="tree-flower tree-flower-main" transform="translate(150, 50)">
                <circle r="16" fill="url(#treeFlowerGradient)"/>
                <circle r="6" fill="#8B4513"/>
            </g>
        </svg>
    </div>

    <div class="controls">
        <button class="btn" onclick="exportBouquetAsPNG(1920, 1080)">Descargar PNG</button>
    </div>

    <script>
        async function exportBouquetAsPNG(width, height) {
            const svg = document.getElementById('bouquetSVG');
            const svgClone = svg.cloneNode(true);
            svgClone.setAttribute('width', width);
            svgClone.setAttribute('height', height);
            
            // Forzar estado final de animaciones
            svgClone.querySelectorAll('.main-trunk, .branch, .tree-flower').forEach(el => {
                el.style.animation = 'none';
                el.style.opacity = '1';
                el.style.transform = 'scale(1)';
                el.style.strokeDashoffset = '0';
            });
            
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgClone);
            const svgDataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
            
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, width, height);
            
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0, width, height);
                const link = document.createElement('a');
                link.download = `ramo-arbol-${width}x${height}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            img.src = svgDataUrl;
        }
    </script>
</body>
</html>
