<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas - Animación Romántica 🌼</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <!-- Fondo animado con partículas -->
    <div class="background">
        <div class="particles-container"></div>
    </div>

    <!-- Contenedor principal -->
    <main class="main-container">
        <!-- Mensajes románticos con efecto typewriter -->
        <div class="messages-container">
            <div class="message-box">
                <h1 class="romantic-message" id="typewriter-text"></h1>
            </div>
        </div>

        <!-- Contenedor para flores animadas aleatorias -->
        <div class="floating-flowers-container"></div>

        <!-- Contenedor para flores interactivas del cursor -->
        <div class="cursor-flowers-container"></div>

        <!-- Barra de carga antes del ramo -->
        <div class="loading-container" id="loading-container">
            <div class="loading-text">Preparando tu ramo de flores amarillas...</div>
            <div class="loading-bar">
                <div class="loading-progress" id="loading-progress"></div>
            </div>
            <div class="loading-flowers">
                <span class="loading-flower">🌻</span>
                <span class="loading-flower">🌼</span>
                <span class="loading-flower">🌻</span>
            </div>
        </div>

        <!-- Contenedor del ramo radial - APARECE PRIMERO -->
        <div class="bouquet-container" id="bouquet-container">
            <!-- Contenedor del moño dentro del ramo -->
            <div class="bow-container" id="bow-container">
                <img src="moño.png" alt="Moño" class="bow-image" id="bow-image">
            </div>
            
            <svg class="bouquet-svg" id="bouquetSVG" viewBox="0 0 660 1800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gradientes EXACTOS de opción A -->
                    <linearGradient id="stemGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#2e7d32"/>
                        <stop offset="100%" style="stop-color:#66bb6a"/>
                    </linearGradient>
                    
                    <radialGradient id="petalGradient" cx="50%" cy="30%">
                        <stop offset="0%" style="stop-color:#fff200"/>
                        <stop offset="100%" style="stop-color:#ffd700"/>
                    </radialGradient>
                    
                    <radialGradient id="centerGradient" cx="50%" cy="50%">
                        <stop offset="0%" style="stop-color:#D2691E"/>
                        <stop offset="100%" style="stop-color:#8B4513"/>
                    </radialGradient>
                </defs>
                
                <!-- Hojas -->
                <g id="leavesGroup"></g>
                
                <!-- Tallos -->
                <g id="stemsGroup"></g>
                
                <!-- Flores -->
                <g id="flowersGroup"></g>
            </svg>
        </div>

        <!-- Mensaje final romántico - APARECE DESPUÉS -->
        <div class="final-message-container">
            <div class="final-message-box">
                <h2 class="final-message" id="final-text"></h2>
            </div>
        </div>

        <!-- Botones de acción -->
        <div class="action-buttons" id="action-buttons">
            <div class="button-group download-group">
                <button class="action-btn" id="download-png">
                    <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" fill="currentColor"/>
                    </svg>
                    Descargar PNG
                </button>
                
                <button class="action-btn" id="download-wallpaper-pc">
                    <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4,6H20V16H4M20,18A2,2 0 0,0 22,16V6C22,4.89 21.1,4 20,4H4C2.89,4 2,4.89 2,6V16A2,2 0 0,0 4,18H0V20H24V18H20Z" fill="currentColor"/>
                    </svg>
                    Wallpaper PC
                </button>
                
                <button class="action-btn" id="download-wallpaper-mobile">
                    <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17,19H7V5H17M17,1H7C5.89,1 5,1.89 5,3V21A2,2 0 0,0 7,23H17A2,2 0 0,0 19,21V3C19,1.89 18.1,1 17,1Z" fill="currentColor"/>
                    </svg>
                    Wallpaper Móvil
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
