<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo CSS-Only - Opción E</title>
    <style>
        :root {
            --stem-color: #2e7d32;
            --petal-color: #ffd700;
            --flower-center: #8B4513;
        }

        .bouquet-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f8f0, #e8f5e8);
            padding: 20px;
            position: relative;
        }

        .css-bouquet {
            position: relative;
            width: 300px;
            height: 400px;
        }

        /* Tallos con divs */
        .css-stem {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform-origin: bottom center;
            background: linear-gradient(to top, var(--stem-color), #66bb6a);
            border-radius: 2px;
            transform: translateX(-50%) scaleY(0);
            animation: growCSStem 0.8s ease-out forwards;
        }

        .css-stem-1 {
            width: 4px;
            height: 200px;
            transform: translateX(-50%) rotate(-30deg) scaleY(0);
            animation-delay: 0.2s;
        }

        .css-stem-2 {
            width: 4px;
            height: 180px;
            transform: translateX(-50%) rotate(-15deg) scaleY(0);
            animation-delay: 0.3s;
        }

        .css-stem-3 {
            width: 5px;
            height: 220px;
            transform: translateX(-50%) rotate(0deg) scaleY(0);
            animation-delay: 0.4s;
        }

        .css-stem-4 {
            width: 4px;
            height: 190px;
            transform: translateX(-50%) rotate(15deg) scaleY(0);
            animation-delay: 0.5s;
        }

        .css-stem-5 {
            width: 4px;
            height: 170px;
            transform: translateX(-50%) rotate(30deg) scaleY(0);
            animation-delay: 0.6s;
        }

        @keyframes growCSStem {
            to { transform: translateX(-50%) rotate(var(--rotation, 0deg)) scaleY(1); }
        }

        /* Flores CSS */
        .css-flower {
            position: absolute;
            width: 30px;
            height: 30px;
            opacity: 0;
            transform: scale(0);
            animation: bloomCSSFlower 0.6s ease-out forwards;
        }

        .css-flower-1 {
            top: 60px;
            left: 80px;
            animation-delay: 1.2s;
        }

        .css-flower-2 {
            top: 80px;
            left: 120px;
            animation-delay: 1.3s;
        }

        .css-flower-3 {
            top: 50px;
            left: 135px;
            animation-delay: 1.4s;
        }

        .css-flower-4 {
            top: 70px;
            left: 170px;
            animation-delay: 1.5s;
        }

        .css-flower-5 {
            top: 90px;
            left: 200px;
            animation-delay: 1.6s;
        }

        @keyframes bloomCSSFlower {
            0% { opacity: 0; transform: scale(0) rotate(-90deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* Pétalos con pseudo-elementos */
        .css-flower::before,
        .css-flower::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 20px;
            background: radial-gradient(ellipse at center, var(--petal-color), #ffb300);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            top: 50%;
            left: 50%;
            transform-origin: center bottom;
        }

        .css-flower::before {
            transform: translate(-50%, -50%) rotate(0deg);
        }

        .css-flower::after {
            transform: translate(-50%, -50%) rotate(90deg);
        }

        /* Más pétalos con elementos adicionales */
        .css-flower .petal-1,
        .css-flower .petal-2,
        .css-flower .petal-3,
        .css-flower .petal-4 {
            position: absolute;
            width: 10px;
            height: 18px;
            background: radial-gradient(ellipse at center, #fff200, var(--petal-color));
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            top: 50%;
            left: 50%;
            transform-origin: center bottom;
        }

        .css-flower .petal-1 { transform: translate(-50%, -50%) rotate(45deg); }
        .css-flower .petal-2 { transform: translate(-50%, -50%) rotate(135deg); }
        .css-flower .petal-3 { transform: translate(-50%, -50%) rotate(225deg); }
        .css-flower .petal-4 { transform: translate(-50%, -50%) rotate(315deg); }

        /* Centro de la flor */
        .css-flower .center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #D2691E, var(--flower-center));
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Hojas CSS */
        .css-leaf {
            position: absolute;
            width: 16px;
            height: 30px;
            background: linear-gradient(to bottom right, #66bb6a, #2e7d32);
            border-radius: 0 100% 0 100%;
            opacity: 0;
            animation: growCSSLeaf 0.5s ease-out forwards;
        }

        .css-leaf-1 {
            bottom: 80px;
            left: 120px;
            transform: rotate(-20deg);
            animation-delay: 1.0s;
        }

        .css-leaf-2 {
            bottom: 90px;
            right: 120px;
            transform: rotate(20deg);
            animation-delay: 1.1s;
        }

        @keyframes growCSSLeaf {
            to { opacity: 1; }
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 10px;
        }

        .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            width: 100%;
        }

        /* Para exportación */
        .static-export .css-stem,
        .static-export .css-flower,
        .static-export .css-leaf {
            animation: none !important;
            opacity: 1 !important;
            transform: translateX(-50%) scaleY(1) !important;
        }

        .static-export .css-flower {
            transform: scale(1) !important;
        }
    </style>
</head>
<body>
    <div class="bouquet-container">
        <div class="css-bouquet" id="cssBouquet">
            <!-- Tallos -->
            <div class="css-stem css-stem-1" style="--rotation: -30deg;"></div>
            <div class="css-stem css-stem-2" style="--rotation: -15deg;"></div>
            <div class="css-stem css-stem-3" style="--rotation: 0deg;"></div>
            <div class="css-stem css-stem-4" style="--rotation: 15deg;"></div>
            <div class="css-stem css-stem-5" style="--rotation: 30deg;"></div>
            
            <!-- Hojas -->
            <div class="css-leaf css-leaf-1"></div>
            <div class="css-leaf css-leaf-2"></div>
            
            <!-- Flores -->
            <div class="css-flower css-flower-1">
                <div class="petal-1"></div>
                <div class="petal-2"></div>
                <div class="petal-3"></div>
                <div class="petal-4"></div>
                <div class="center"></div>
            </div>
            
            <div class="css-flower css-flower-2">
                <div class="petal-1"></div>
                <div class="petal-2"></div>
                <div class="petal-3"></div>
                <div class="petal-4"></div>
                <div class="center"></div>
            </div>
            
            <div class="css-flower css-flower-3">
                <div class="petal-1"></div>
                <div class="petal-2"></div>
                <div class="petal-3"></div>
                <div class="petal-4"></div>
                <div class="center"></div>
            </div>
            
            <div class="css-flower css-flower-4">
                <div class="petal-1"></div>
                <div class="petal-2"></div>
                <div class="petal-3"></div>
                <div class="petal-4"></div>
                <div class="center"></div>
            </div>
            
            <div class="css-flower css-flower-5">
                <div class="petal-1"></div>
                <div class="petal-2"></div>
                <div class="petal-3"></div>
                <div class="petal-4"></div>
                <div class="center"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="exportCSSBouquetAsPNG(1920, 1080)">Descargar PNG</button>
    </div>

    <script>
        async function exportCSSBouquetAsPNG(width, height) {
            const bouquet = document.getElementById('cssBouquet');
            
            // Aplicar clase estática
            document.documentElement.classList.add('static-export');
            
            // Esperar un frame
            await new Promise(resolve => requestAnimationFrame(resolve));
            
            try {
                // Usar html2canvas si está disponible, sino fallback manual
                if (typeof html2canvas !== 'undefined') {
                    const canvas = await html2canvas(bouquet, {
                        width: width,
                        height: height,
                        backgroundColor: 'white',
                        scale: width / bouquet.offsetWidth
                    });
                    
                    const link = document.createElement('a');
                    link.download = `ramo-css-${width}x${height}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } else {
                    alert('Para exportar ramos CSS, incluya la librería html2canvas');
                }
            } finally {
                document.documentElement.classList.remove('static-export');
            }
        }
    </script>
    
    <!-- Opcional: incluir html2canvas para exportación -->
    <!-- <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script> -->
</body>
</html>
