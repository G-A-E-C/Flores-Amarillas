<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramo Canvas - Opción F</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
            font-family: Arial, sans-serif;
        }

        .canvas-container {
            position: relative;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: white;
            padding: 20px;
        }

        #bouquetCanvas {
            border-radius: 8px;
            background: white;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            width: 100%;
            font-size: 12px;
        }

        .btn:hover {
            background: #45a049;
        }

        .config {
            margin-top: 10px;
            font-size: 11px;
        }

        .config label {
            display: block;
            margin: 5px 0 2px 0;
        }

        .config input {
            width: 100%;
            padding: 2px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <canvas id="bouquetCanvas" width="400" height="600"></canvas>
    </div>

    <div class="controls">
        <button class="btn" onclick="regenerateCanvasBouquet()">Regenerar</button>
        <button class="btn" onclick="exportCanvasBouquetAsPNG(1920, 1080)">PNG HD</button>
        <button class="btn" onclick="exportCanvasBouquetAsPNG(1080, 1920)">Móvil</button>
        
        <div class="config">
            <label>Tallos:</label>
            <input type="range" id="numStems" min="3" max="12" value="7" onchange="updateConfig()">
            
            <label>Pétalos:</label>
            <input type="range" id="numPetals" min="5" max="16" value="8" onchange="updateConfig()">
            
            <label>Tamaño:</label>
            <input type="range" id="flowerSize" min="8" max="25" value="15" onchange="updateConfig()">
        </div>
    </div>

    <script>
        class CanvasBouquet {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.width = canvas.width;
                this.height = canvas.height;
                
                this.config = {
                    numStems: 7,
                    numPetals: 8,
                    flowerSize: 15,
                    basePoint: { x: this.width / 2, y: this.height - 50 },
                    stemLengthRange: [150, 250],
                    angleRange: [-60, 60],
                    curvatureIntensity: 0.3
                };
                
                this.stems = [];
                this.flowers = [];
                this.animationProgress = 0;
                this.isAnimating = false;
            }

            updateConfig(newConfig) {
                Object.assign(this.config, newConfig);
                this.generateBouquet();
            }

            generateBouquet() {
                this.stems = [];
                this.flowers = [];
                
                for (let i = 0; i < this.config.numStems; i++) {
                    const angle = this.lerp(
                        this.config.angleRange[0], 
                        this.config.angleRange[1], 
                        i / (this.config.numStems - 1)
                    );
                    
                    const length = this.random(
                        this.config.stemLengthRange[0],
                        this.config.stemLengthRange[1]
                    );
                    
                    const stem = this.createStem(angle, length, i);
                    this.stems.push(stem);
                    
                    const flower = this.createFlower(stem.endPoint, i);
                    this.flowers.push(flower);
                }
            }

            createStem(angle, length, index) {
                const angleRad = (angle * Math.PI) / 180;
                const base = this.config.basePoint;
                
                // Curva cuadrática para el tallo
                const curvature = this.random(-50, 50) * this.config.curvatureIntensity;
                const midX = base.x + Math.sin(angleRad) * (length * 0.5) + curvature;
                const midY = base.y - (length * 0.6);
                
                const endX = base.x + Math.sin(angleRad) * curvature * 0.5;
                const endY = base.y - length;
                
                return {
                    startPoint: base,
                    controlPoint: { x: midX, y: midY },
                    endPoint: { x: endX, y: endY },
                    width: this.random(3, 7),
                    color: this.createStemGradient(),
                    animationDelay: index * 0.1
                };
            }

            createFlower(position, index) {
                const petals = [];
                const petalCount = this.config.numPetals;
                const size = this.config.flowerSize;
                
                for (let i = 0; i < petalCount; i++) {
                    const angle = (360 / petalCount) * i;
                    const petalLength = this.random(size * 0.8, size * 1.2);
                    const petalWidth = this.random(size * 0.3, size * 0.5);
                    
                    petals.push({
                        angle: angle,
                        length: petalLength,
                        width: petalWidth,
                        offsetX: this.random(-2, 2),
                        offsetY: this.random(-2, 2)
                    });
                }
                
                return {
                    position: position,
                    petals: petals,
                    centerSize: this.random(size * 0.2, size * 0.4),
                    color: this.createPetalGradient(),
                    centerColor: '#8B4513',
                    animationDelay: 1 + index * 0.1
                };
            }

            createStemGradient() {
                const gradient = this.ctx.createLinearGradient(0, 0, 0, 100);
                gradient.addColorStop(0, '#2e7d32');
                gradient.addColorStop(0.5, '#4caf50');
                gradient.addColorStop(1, '#66bb6a');
                return gradient;
            }

            createPetalGradient() {
                const gradient = this.ctx.createRadialGradient(0, 0, 0, 0, 0, 20);
                gradient.addColorStop(0, '#fff200');
                gradient.addColorStop(0.4, '#ffed4e');
                gradient.addColorStop(0.8, '#ffd700');
                gradient.addColorStop(1, '#ffb300');
                return gradient;
            }

            animate() {
                this.isAnimating = true;
                this.animationProgress = 0;
                const startTime = Date.now();
                const animationDuration = 3000; // 3 segundos
                
                const frame = () => {
                    const elapsed = Date.now() - startTime;
                    this.animationProgress = Math.min(elapsed / animationDuration, 1);
                    
                    this.draw();
                    
                    if (this.animationProgress < 1) {
                        requestAnimationFrame(frame);
                    } else {
                        this.isAnimating = false;
                    }
                };
                
                requestAnimationFrame(frame);
            }

            draw() {
                // Limpiar canvas
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                // Dibujar fondo
                this.drawBackground();
                
                // Dibujar tallos
                this.stems.forEach((stem, index) => {
                    this.drawStem(stem, index);
                });
                
                // Dibujar hojas
                this.drawLeaves();
                
                // Dibujar flores
                this.flowers.forEach((flower, index) => {
                    this.drawFlower(flower, index);
                });
                
                // Dibujar lazo
                this.drawRibbon();
            }

            drawBackground() {
                const gradient = this.ctx.createLinearGradient(0, 0, this.width, this.height);
                gradient.addColorStop(0, '#f8fffe');
                gradient.addColorStop(1, '#f0f8f0');
                
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.width, this.height);
            }

            drawStem(stem, index) {
                const progress = this.isAnimating ? 
                    Math.max(0, Math.min(1, (this.animationProgress - stem.animationDelay) * 5)) : 1;
                
                if (progress <= 0) return;
                
                this.ctx.strokeStyle = stem.color;
                this.ctx.lineWidth = stem.width;
                this.ctx.lineCap = 'round';
                
                this.ctx.beginPath();
                this.ctx.moveTo(stem.startPoint.x, stem.startPoint.y);
                
                if (progress >= 1) {
                    this.ctx.quadraticCurveTo(
                        stem.controlPoint.x, stem.controlPoint.y,
                        stem.endPoint.x, stem.endPoint.y
                    );
                } else {
                    // Animar el crecimiento de la curva
                    const currentX = this.lerp(stem.startPoint.x, stem.endPoint.x, progress);
                    const currentY = this.lerp(stem.startPoint.y, stem.endPoint.y, progress);
                    const controlX = this.lerp(stem.startPoint.x, stem.controlPoint.x, progress);
                    const controlY = this.lerp(stem.startPoint.y, stem.controlPoint.y, progress);
                    
                    this.ctx.quadraticCurveTo(controlX, controlY, currentX, currentY);
                }
                
                this.ctx.stroke();
            }

            drawFlower(flower, index) {
                const progress = this.isAnimating ? 
                    Math.max(0, Math.min(1, (this.animationProgress - flower.animationDelay) * 3)) : 1;
                
                if (progress <= 0) return;
                
                this.ctx.save();
                this.ctx.translate(flower.position.x, flower.position.y);
                this.ctx.scale(progress, progress);
                
                // Dibujar pétalos usando funciones trigonométricas
                flower.petals.forEach(petal => {
                    this.ctx.save();
                    this.ctx.rotate((petal.angle * Math.PI) / 180);
                    this.ctx.translate(petal.offsetX, petal.offsetY);
                    
                    this.ctx.fillStyle = flower.color;
                    this.ctx.beginPath();
                    
                    // Crear pétalo usando curvas de Bézier
                    const petalPath = this.createPetalPath(petal.length, petal.width);
                    this.ctx.fill(petalPath);
                    
                    this.ctx.restore();
                });
                
                // Centro de la flor
                this.ctx.fillStyle = flower.centerColor;
                this.ctx.beginPath();
                this.ctx.arc(0, 0, flower.centerSize, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.restore();
            }

            createPetalPath(length, width) {
                const path = new Path2D();
                
                // Pétalo usando curva polar
                path.moveTo(0, 0);
                path.bezierCurveTo(
                    -width/2, -length*0.3,
                    -width/3, -length*0.7,
                    0, -length
                );
                path.bezierCurveTo(
                    width/3, -length*0.7,
                    width/2, -length*0.3,
                    0, 0
                );
                
                return path;
            }

            drawLeaves() {
                if (!this.isAnimating || this.animationProgress > 0.8) {
                    const leaves = [
                        { x: this.config.basePoint.x - 30, y: this.config.basePoint.y - 20, rotation: -30 },
                        { x: this.config.basePoint.x + 30, y: this.config.basePoint.y - 15, rotation: 30 },
                        { x: this.config.basePoint.x, y: this.config.basePoint.y - 10, rotation: 0 }
                    ];
                    
                    leaves.forEach(leaf => {
                        this.ctx.save();
                        this.ctx.translate(leaf.x, leaf.y);
                        this.ctx.rotate((leaf.rotation * Math.PI) / 180);
                        
                        this.ctx.fillStyle = '#4caf50';
                        this.ctx.beginPath();
                        this.ctx.ellipse(0, 0, 8, 20, 0, 0, Math.PI * 2);
                        this.ctx.fill();
                        
                        this.ctx.restore();
                    });
                }
            }

            drawRibbon() {
                if (!this.isAnimating || this.animationProgress > 0.9) {
                    const ribbonY = this.config.basePoint.y + 20;
                    
                    this.ctx.strokeStyle = '#e53935';
                    this.ctx.lineWidth = 4;
                    this.ctx.lineCap = 'round';
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.config.basePoint.x - 30, ribbonY);
                    this.ctx.quadraticCurveTo(this.config.basePoint.x, ribbonY - 10, this.config.basePoint.x + 30, ribbonY);
                    this.ctx.stroke();
                }
            }

            exportToPNG(width, height) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');
                
                // Guardar estado actual
                const originalCanvas = this.canvas;
                const originalCtx = this.ctx;
                const originalWidth = this.width;
                const originalHeight = this.height;
                
                // Configurar para exportación
                this.canvas = tempCanvas;
                this.ctx = tempCtx;
                this.width = width;
                this.height = height;
                this.config.basePoint = { x: width / 2, y: height - 50 };
                
                // Ajustar escala
                const scale = Math.min(width / originalWidth, height / originalHeight);
                this.config.stemLengthRange = this.config.stemLengthRange.map(l => l * scale);
                this.config.flowerSize *= scale;
                
                // Regenerar y dibujar
                this.generateBouquet();
                this.isAnimating = false;
                this.draw();
                
                // Restaurar estado
                this.canvas = originalCanvas;
                this.ctx = originalCtx;
                this.width = originalWidth;
                this.height = originalHeight;
                this.config.basePoint = { x: originalWidth / 2, y: originalHeight - 50 };
                this.config.stemLengthRange = this.config.stemLengthRange.map(l => l / scale);
                this.config.flowerSize /= scale;
                
                return tempCanvas.toDataURL('image/png');
            }

            // Utilidades
            random(min, max) {
                return Math.random() * (max - min) + min;
            }

            lerp(start, end, factor) {
                return start + (end - start) * factor;
            }
        }

        // Instancia global
        let bouquet;

        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('bouquetCanvas');
            bouquet = new CanvasBouquet(canvas);
            bouquet.generateBouquet();
            bouquet.animate();
        });

        function regenerateCanvasBouquet() {
            bouquet.generateBouquet();
            bouquet.animate();
        }

        function updateConfig() {
            const numStems = parseInt(document.getElementById('numStems').value);
            const numPetals = parseInt(document.getElementById('numPetals').value);
            const flowerSize = parseInt(document.getElementById('flowerSize').value);
            
            bouquet.updateConfig({
                numStems: numStems,
                numPetals: numPetals,
                flowerSize: flowerSize
            });
        }

        function exportCanvasBouquetAsPNG(width, height) {
            const dataUrl = bouquet.exportToPNG(width, height);
            const link = document.createElement('a');
            link.download = `ramo-canvas-${width}x${height}.png`;
            link.href = dataUrl;
            link.click();
        }
    </script>
</body>
</html>
